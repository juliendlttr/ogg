[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oggrestapi"
version = "1.0.0"
description = "Python client for the Oracle GoldenGate REST API"
readme = "README.md"
requires-python = ">=3.6"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Julien DELATTRE" },
]
dependencies = [
    "requests",
    "urllib3",
]

[project.urls]
Repository = "https://github.com/juliendlttr/ogg"

[tool.hatch.build.targets.wheel]
packages = ["src/oggrestapi"]
